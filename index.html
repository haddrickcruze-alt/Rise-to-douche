<!DOCTYPE html>
<html>
<head>
  <title>Rise to Success</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Rise to Success</h1>

<div id="stats">
  <p>💰 Money: $<span id="money">100</span></p>
  <p>⚡ Energy: <span id="energy">100</span></p>
  <p>🔥 Aura: <span id="aura">0</span></p>
  <p>💪 Strength: <span id="strength">1</span></p>
  <p>🕒 Time: <span id="time">6:00 AM</span></p>
</div>

<h2>Actions</h2>

<button onclick="work()">💼 Work</button>
<button onclick="gym()">💪 Gym</button>
<button onclick="club()">🎉 Club</button>
<button onclick="sleepPlayer()">😴 Sleep</button>

<h2>Buy</h2>

<button onclick="buyBike()">🚲 Bike ($500)</button>
<button onclick="buyHouse()">🏠 Apartment ($10000)</button>

<h2>Cheat Codes</h2>

<input id="cheatInput" placeholder="Enter code">
<button onclick="useCheat()">Use</button>

<p id="message"></p>

<script src="script.js"></script>

</body>
</html>
